name: Validate and deploy Azure Function

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: func-dian-xml-cpabaas-dev
  AZURE_FUNCTIONAPP_PACKAGE_PATH: .
  PYTHON_VERSION: "3.11"

jobs:
  validate:
    name: Validate Python project
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q function_app.py dian dian_ingestion contabilidad_ingestion tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Test XML storage preparation without Azure
        shell: pwsh
        run: ./tests/Test-PrepareXmlStorage.ps1

  deploy:
    name: Deploy to Azure
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: dian-function-dev-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare private XML container and Function identity access
        shell: pwsh
        env:
          DIAN_STORAGE_ACCOUNT: ${{ vars.DIAN_STORAGE_ACCOUNT }}
          DIAN_STORAGE_RESOURCE_GROUP: ${{ vars.DIAN_STORAGE_RESOURCE_GROUP }}
          AZURE_FUNCTIONAPP_RESOURCE_GROUP: ${{ vars.AZURE_FUNCTIONAPP_RESOURCE_GROUP }}
        run: |
          ./scripts/Prepare-XmlStorage.ps1 `
            -StorageAccount $env:DIAN_STORAGE_ACCOUNT `
            -StorageResourceGroup $env:DIAN_STORAGE_RESOURCE_GROUP `
            -FunctionName $env:AZURE_FUNCTIONAPP_NAME `
            -FunctionResourceGroup $env:AZURE_FUNCTIONAPP_RESOURCE_GROUP

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          remote-build: true
          respect-funcignore: true
